services:
  - type: web
    name: threepanda
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: cron
    name: threepanda-keepalive
    env: node
    plan: free
    rootDir: backend
    schedule: "*/14 * * * *"
    buildCommand: npm install
    startCommand: node keepalive.js
    envVars:
      - key: KEEPALIVE_URL
        value: https://3panda.ddns.net/api/health
      - key: KEEPALIVE_FALLBACK_URL
        value: https://threepanda.onrender.com/api/health
