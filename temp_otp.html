    <!-- OTP Popup -->
    <div class="popup-overlay hidden" id="otp-overlay"></div>
    <div class="popup-panel hidden restaurant-owner-popup" id="otp-popup" style="max-width: 400px;">
        <div class="popup-header">
            <h3 id="otp-modal-title">Verify Email</h3>
            <button type="button" class="popup-close" id="close-otp-modal">&times;</button>
        </div>
        <div class="popup-body">
            <p id="otp-modal-desc" style="margin-bottom:1rem;color:var(--text-muted)">Enter the 6-digit code sent to your email.</p>
            <form id="otp-form">
                <input type="hidden" id="otp-purpose">
                <input type="hidden" id="otp-email">
                <div class="form-group floating-group">
                    <input type="text" id="otp-code" class="form-control" placeholder=" " required maxlength="6">
                    <label for="otp-code">6-Digit OTP</label>
                </div>
                <div class="form-group floating-group has-password-toggle hidden" id="otp-new-password-group">
                    <input type="password" id="otp-new-password" class="form-control" placeholder=" ">
                    <label for="otp-new-password">New Password</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem;">Verify & Proceed</button>
            </form>
        </div>
    </div>
